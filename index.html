function handleInput(e) {
  const t = e.target, p = cur();
  if (!p) return;
  if (t.dataset.fill) { fillState(p)[t.dataset.fill] = t.value; if (t.dataset.fill === 'paste') { const b = document.querySelector('#work [data-action=fill-copy]'); if (b) b.disabled = !(t.value.trim() || fill.docs.length); } return; }
  if (t.dataset.fillItem != null) { if (e.type === 'change') { fill.items[+t.dataset.fillItem].on = t.checked; renderWork(); } return; }
  if (t.dataset.agree) {
    const a = Object.assign({}, p.meta.agreed || {}), k = t.dataset.agree;
    if (t.checked) a[k] = a[k] || localIso(new Date()); else delete a[k];
    if (JSON.stringify(a) !== JSON.stringify(p.meta.agreed || {})) { p.meta.agreed = a; saveSoon(); renderSide(); }
    return;
  }
  if (t.dataset.meta) {
    const k = t.dataset.meta;
    if (k === 'mode') setNeed(p, t.value);
    else if (k === 'tier') setTier(p, t.value);
    else p.meta[k] = t.type === 'checkbox' ? t.checked : t.value;
    if (k === 'verified') t.closest('.check').classList.toggle('on', t.checked);
    saveSoon();
    if (k === 'mode' && p.meta.template === 'prospect' && MODES[t.value] && t.value !== 'prospect') { saveSoon(); fadeSwap(() => { repick = true; renderAll(); }); return; }
    if (k === 'tier' || k === 'mode') { saveSoon(); renderAll(); if (k === 'mode' && t.value === 'other') { const b = document.querySelector('#work [data-meta=modeOther]'); if (b) b.focus(); } return; }
    if (k === 'account') renderPicker();
    sideSoon(); return;
  }
  if (t.dataset.note) { p.notes[t.dataset.note] = t.value; saveSoon(); return; }
  if (t.dataset.custom) {
    const c = p.custom.find(x => x.id === t.dataset.custom);
    if (!c || t.dataset.add) return;
    if (t.dataset.ckey === 'items') c.items[+t.dataset.idx] = t.value;
    else c[t.dataset.ckey] = t.value;
    saveSoon(); sideSoon(); return;
  }
  if (t.dataset.ms) {
    const ph = p.data.milestones.phases[t.dataset.ms];
    const item = ph[+t.dataset.idx];
    if (t.dataset.mkey === 'done') { item.done = t.checked; t.closest('.ms').classList.toggle('done', t.checked); }
    else if (t.dataset.mkey === 'who') {
      const k = 'ms|' + t.dataset.ms + '|' + t.dataset.idx;
      if (t.value === '__other') { otherOpen[k] = true; item.who = ''; } else { delete otherOpen[k]; item.who = t.value; }
      saveSoon(); sideSoon();
      if (e.type === 'change') { renderWork(); if (t.value === '__other') { const b = document.querySelector(`#work input[data-ms="${t.dataset.ms}"][data-idx="${t.dataset.idx}"][data-mkey=whoText]`); if (b) b.focus(); } }
      return;
    }
    else if (t.dataset.mkey === 'whoText') item.who = t.value;
    else item.text = t.value;
    if (!msIsStarting(t.dataset.ms, item)) { const tag = t.closest('.ms') && t.closest('.ms').querySelector('.start-tag'); if (tag) tag.remove(); }
    saveSoon(); sideSoon(); return;
  }
  if (t.dataset.sec && t.dataset.field) {
    if (t.dataset.add) return;
    const d = p.data[t.dataset.sec] || (p.data[t.dataset.sec] = {});
    const f = t.dataset.field;
    if (t.dataset.otherSel) {   // a pick-one list, with "Something else"
      const row = t.dataset.row, k = t.dataset.sec + '|' + f + (row != null ? '|' + row + '|' + t.dataset.col : '');
      const setV = v => { if (row != null) d[f][+row][t.dataset.col] = v; else d[f] = v; };
      if (t.value === '__other') { otherOpen[k] = true; setV(''); } else { delete otherOpen[k]; setV(t.value); }
      saveSoon(); sideSoon();
      if (e.type === 'change') {
        renderWork();
        if (t.value === '__other') { const sel = `#work .other-box[data-sec="${t.dataset.sec}"][data-field="${f}"]` + (row != null ? `[data-row="${row}"][data-col="${t.dataset.col}"]` : ''); const box = document.querySelector(sel); if (box) box.focus(); }
      }
      return;
    }
    if (t.dataset.otherChk) {   // tick boxes: "Something else"
      const k = t.dataset.sec + '|' + f, sec = sectionByKey(t.dataset.sec), fd = sec && sec.fields.find(x => x.key === f);
      if (t.checked) otherOpen[k] = true; else { delete otherOpen[k]; d[f] = (Array.isArray(d[f]) ? d[f] : []).filter(x => fd && fd.options.includes(x)); }
      saveSoon(); sideSoon();
      if (e.type === 'change') { renderWork(); if (t.checked) { const box = document.querySelector(`#work .other-box[data-sec="${t.dataset.sec}"][data-field="${f}"]`); if (box) box.focus(); } }
      return;
    }
    if (t.dataset.otherText === 'checks') {
      const sec = sectionByKey(t.dataset.sec), fd = sec && sec.fields.find(x => x.key === f), txt = t.value.trim();
      d[f] = (Array.isArray(d[f]) ? d[f] : []).filter(x => fd && fd.options.includes(x)).concat(txt ? [txt] : []);
      saveSoon(); sideSoon(); return;
    }
    if (t.dataset.opt) {
      const arr = d[f] || (d[f] = []);
      const i = arr.indexOf(t.dataset.opt);
      if (t.checked && i < 0) arr.push(t.dataset.opt);
      if (!t.checked && i >= 0) arr.splice(i, 1);
      t.closest('.check').classList.toggle('on', t.checked);
    } else if (t.dataset.row != null) {
      d[f][+t.dataset.row][t.dataset.col] = t.value;
    } else if (t.dataset.idx != null) {
      d[f][+t.dataset.idx] = t.value;
    } else {
      d[f] = t.value;
      const s = sectionByKey(t.dataset.sec);
      if (s && s.fields.some(x => x.showIf) && e.type === 'change') { saveSoon(); renderWork(); sideSoon(); return; }
    }
    saveSoon(); sideSoon();
  }
}

function listTarget(el) {
  const p = cur();
  if (el.dataset.custom) { const c = p.custom.find(x => x.id === el.dataset.custom); return c ? (c.items || (c.items = [])) : null; }
  const d = p.data[el.dataset.sec] || (p.data[el.dataset.sec] = {});
  return d[el.dataset.field] || (d[el.dataset.field] = []);
}
function addFromInput(input) {
  const v = input.value.trim();
  if (!v) return;
  const arr = listTarget(input);
  if (!arr) return;
  arr.push(v);
  saveSoon();
  const sel = input.dataset.custom ? `[data-custom="${input.dataset.custom}"][data-add]` : `[data-sec="${input.dataset.sec}"][data-field="${input.dataset.field}"][data-add]`;
  renderWork(); sideSoon();
  const again = document.querySelector('#work input' + sel);
  if (again) again.focus();
}

function handleClick(e) {
  const g = e.target.closest('[data-goto]');
  if (g) { e.preventDefault(); go(g.dataset.goto); return; }
  const cmd = e.target.closest('[data-cmd]');
  if (cmd) { document.getElementById('moreMenu').classList.remove('open'); document.getElementById('pdfMenu').classList.remove('open'); runCmd(cmd.dataset.cmd); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const p = cur();
  const act = a.dataset.action;
  if (act === 'ask-more') {
    const k = a.dataset.key; askOpen[k] = !askOpen[k];
    const box = document.getElementById('ask-' + k), s = sectionByKey(k, p);
    if (box && s) box.outerHTML = askBoxHtml(p, s);
    return;
  }
  if (act === 'logo-clear') { logoSet(a.dataset.scope, null, ''); return; }
  if (act === 'create') {
    const nw = { account: document.getElementById('w-account').value.trim(), mode: document.getElementById('w-mode').value, modeOther: (document.getElementById('w-modeOther') || {}).value || '', rollout: ROLLOUT_MODES.includes(document.getElementById('w-mode').value) ? document.getElementById('w-rollout').value : '' };
    if (nw.mode === 'prospect') { fadeSwap(() => { pendingNew = null; newPlan({ account: nw.account, mode: 'prospect', rollout: '', template: 'prospect', flow: seedFlow('prospect') }); renderAll(); }); return; }   // straight into the prospecting steps
    fadeSwap(() => { pendingNew = nw; renderAll(); }); return;
  }
  if (act === 'repick') { fadeSwap(() => { repick = true; renderAll(); }); return; }
  if (act === 'start-back' && repick) { if (p && p.meta.template === 'prospect' && p.meta.mode !== 'prospect') { setNeed(p, 'prospect'); saveSoon(); } fadeSwap(() => { repick = false; currentSec = 'basics'; renderAll(); }); return; }
  if (act === 'start' && repick && p) { switchStart(p, a.dataset.t); return; }
  if (act === 'start-back') {
    fadeSwap(() => {
      const nw = pendingNew; pendingNew = null; renderAll();
      if (nw) { document.getElementById('w-account').value = nw.account; logoSearchSync(); document.getElementById('w-mode').value = nw.mode; const b = document.getElementById('w-modeOther'); b.value = nw.modeOther || ''; b.style.display = nw.mode === 'other' ? '' : 'none'; document.getElementById('w-rollout').value = nw.rollout || 'first'; welcomeRollout(nw.mode); }
    }); return;
  }
  if (act === 'start') {
    const t = a.dataset.t, nw = pendingNew || { account: '', mode: 'launch' };
    if (t === 'custom') { fadeSwap(() => { builder = { forPlan: null, draft: seedFlow('guided'), open: null, msg: '' }; renderAll(); }); return; }
    fadeSwap(() => { pendingNew = null; newPlan(Object.assign({ account: nw.account, mode: nw.mode, modeOther: nw.mode === 'other' ? nw.modeOther : '', rollout: nw.rollout || '', template: t }, t === 'flintco' ? { flow: seedFlow('flintco') } : {})); renderAll(); });
    return;
  }
  if (act === 'present') { openPresent(); return; }
  if (!p) return;
  if (act === 'sort-move' || act === 'sort-delete') {
    const m = miscOf(p), id = a.dataset.id, it = id === 'end' ? { q: '', a: m.end } : m.items.find(x => x.id === id);
    if (!it) return;
    if (act === 'sort-move') {
      const to = document.querySelector(`[data-sort-to="${id}"]`).value;
      if (!to) { alert('Pick where this goes first.'); return; }
      if (!sortApply(p, to, it.q, it.a)) { alert("That doesn't match the choices there. Pick another spot, or move it to that step's notes."); return; }
    } else if (!confirm('Delete this note?')) return;
    if (id === 'end') m.end = ''; else { m.items.forEach(x => { if (x.at === 'x|' + id) x.at = it.at; }); m.items = m.items.filter(x => x.id !== id); }
    saveSoon(); renderAll(); return;
  }
  if (act.startsWith('fill-')) { fillClick(act, a, p); return; }
  if (act === 'copy-rows') {
    const s = sectionByKey(a.dataset.sec, p), f = s.fields.find(x => x.key === a.dataset.field), rows = (p.data[s.key] || {})[f.key] || [];
    const cell = v => String(v || '').replace(/[\t\n]+/g, ' ').trim();
    const tsv = [f.columns.map(c => c.label).join('\t')].concat(rows.filter(r => Object.values(r).some(Boolean)).map(r => f.columns.map(c => cell(r[c.key])).join('\t'))).join('\n');
    copyText(tsv).then(ok => showToast(ok ? 'Copied. Paste it into a spreadsheet.' : 'This browser blocked copying. Try again from the hosted page.'));
    return;
  }
  if (act === 'rollout') { setRollout(p, a.dataset.v); saveSoon(); renderAll(); return; }
  if (act === 'edit-steps') {
    builder = { forPlan: p.id, draft: p.meta.flow ? clone(p.meta.flow) : { name: '', steps: visibleSections(p).map(s => ({ key: s.key })), own: {} }, open: null, msg: '' };
    renderWork(); window.scrollTo(0, 0); return;
  }
  if (act === 'add-item') {
    const sel = a.dataset.custom ? `[data-custom="${a.dataset.custom}"][data-add]` : `[data-sec="${a.dataset.sec}"][data-field="${a.dataset.field}"][data-add]`;
    const input = document.querySelector('#work input' + sel);
    if (input) addFromInput(input);
    return;
  }
  if (act === 'remove-item') { const arr = listTarget(a); arr.splice(+a.dataset.idx, 1); saveSoon(); renderWork(); sideSoon(); return; }
  if (act === 'add-row') {
    const s = sectionByKey(a.dataset.sec), f = s.fields.find(x => x.key === a.dataset.field);
    const row = {}; f.columns.forEach(c => row[c.key] = '');
    const sd = p.data[s.key] || (p.data[s.key] = {});
    (sd[f.key] = sd[f.key] || []).push(row);
    saveSoon(); renderWork(); sideSoon();
    const inputs = document.querySelectorAll(`#work [data-sec="${s.key}"][data-field="${f.key}"][data-row="${p.data[s.key][f.key].length - 1}"]`);
    if (inputs[0]) inputs[0].focus();
    return;
  }
  if (act === 'remove-row') { p.data[a.dataset.sec][a.dataset.field].splice(+a.dataset.row, 1); saveSoon(); renderWork(); sideSoon(); return; }
  if (act === 'add-ms') {
    p.data.milestones.phases[a.dataset.ms].push({ text: '', done: false });
    saveSoon(); renderWork(); sideSoon();
    const list = document.querySelectorAll(`#work input[type=text][data-ms="${a.dataset.ms}"]`);
    if (list.length) list[list.length - 1].focus();

  }
  if (act === 'keep-ms') { p.data.milestones.phases[a.dataset.ms][+a.dataset.idx].kept = true; saveSoon(); renderWork(); sideSoon(); return; }
  if (act === 'keep-phase') { p.data.milestones.phases[a.dataset.ms].forEach(m => { if (msIsStarting(a.dataset.ms, m)) m.kept = true; }); saveSoon(); renderWork(); sideSoon(); return; }
  if (act === 'keep-rhythm') { const d = p.data.milestones; d.kept = (d.kept || []).concat([a.dataset.k]); saveSoon(); renderWork(); sideSoon(); return; }
  if (act === 'remove-ms') { p.data.milestones.phases[a.dataset.ms].splice(+a.dataset.idx, 1); saveSoon(); renderWork(); sideSoon(); return; }
  if (act === 'add-section') { addSections(p, [a.dataset.key]); saveSoon(); go(a.dataset.key); renderSide(); return; }
  if (act === 'remove-section') {
    if (p.meta.flow) p.meta.flow.steps = p.meta.flow.steps.filter(x => x.key !== a.dataset.key);
    p.meta.sections = (p.meta.sections || []).filter(k => k !== a.dataset.key); saveSoon(); go('addmore'); renderSide(); return;
  }
  if (act === 'add-preset') {
    addSections(p, presetSections(a.dataset.tier));
    if (Object.keys(TIERS).indexOf(a.dataset.tier) > Object.keys(TIERS).indexOf(p.meta.tier)) p.meta.tier = a.dataset.tier;
    saveSoon(); renderAll(); return;
  }
  if (act === 'add-branch') {
    const c = { id: uid(), title: '', items: [], notes: '' };
    p.custom.push(c); saveSoon(); go('custom:' + c.id);
    const t = document.querySelector('#work [data-ckey="title"]'); if (t) t.focus();
    renderSide(); return;
  }
  if (act === 'delete-branch') {
    if (!confirm('Delete this branch and its items?')) return;
    p.custom = p.custom.filter(c => c.id !== a.dataset.id); saveSoon(); go('basics'); renderSide(); return;
  }
}

function runCmd(c) {
  const p = cur();
  if (c === 'team') { openTeamPanel(); return; }
  if (c === 'theme') { setTheme(!isDark()); return; }
  if (c === 'new') { welcomeLogo = null; logoMsg.welcome = ''; currentId = null; currentSec = 'basics'; pendingNew = null; builder = null; repick = false; renderAll(); return; }
  if (c === 'import') { document.getElementById('importFile').click(); return; }
  if (!p) return;
  if (c === 'fill') { go('fill'); return; }
  if (c === 'hubspot') { copyText(hubspotSummary(p)).then(ok => showToast(ok ? 'Copied. Paste it as a note on the company in HubSpot.' : 'This browser blocked copying. Try again from the hosted page.')); return; }
  if (c === 'pdf-customer') { exportPdf(true); return; }
  if (c === 'pdf-internal') { exportPdf(false); return; }
  if (c === 'duplicate') {
    const copy = clone(p); copy.id = uid(); copy.meta.account = (p.meta.account || 'Untitled') + ' (copy)';
    copy.meta.created = copy.meta.updated = new Date().toISOString();
    plans[copy.id] = copy; currentId = copy.id; saveNow(); renderAll(); return;
  }
  if (c === 'export') {
    const blob = new Blob([JSON.stringify({ app: 'success-plan-builder', version: APP_VERSION, exported: new Date().toISOString(), plan: p }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = slug(p.meta.account) + '-success-plan.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return;
  }
  if (c === 'delete') {
    if (!confirm('Delete the plan for ' + (p.meta.account || 'this account') + '? Export it first if you might want it back.')) return;
    delete plans[p.id]; currentId = Object.keys(plans)[0] || null; currentSec = 'basics'; saveNow(); renderAll(); return;
  }
}

function importFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      if (obj && obj.kind === 'build' && obj.build) {
        const b = obj.build, all = loadBuilds(), id = uid();
        all[id] = { id, name: b.name || 'Shared build', steps: b.steps || [], own: b.own || {}, saved: new Date().toISOString() };
        storeBuilds(all);
        if (builder) { builder.draft = clone({ name: all[id].name, steps: all[id].steps, own: all[id].own }); builder.open = null; builder.msg = 'Opened "' + all[id].name + '" and saved it in this browser.'; renderWork(); }
        else alert('Saved the build "' + all[id].name + '" in this browser. Pick it in Custom Build, under Start from.');
        return;
      }
      const p = obj.plan || obj;
      if (!p || !p.meta || !p.data) throw new Error('Not a success plan file');
      // fill anything newer versions added
      const fresh = blankData();
      Object.keys(fresh).forEach(k => { p.data[k] = Object.assign(fresh[k], p.data[k] || {}); });
      p.custom = p.custom || []; p.notes = p.notes || {};
      migrate(p);
      if (plans[p.id] && !confirm('A plan with this ID is already here (' + (plans[p.id].meta.account || 'Untitled') + '). Replace it with the file?')) p.id = uid();
      if (!p.id) p.id = uid();
      plans[p.id] = p; currentId = p.id; currentSec = 'basics'; saveNow(); renderAll();
    } catch (err) { alert('That file could not be read as a success plan.'); }
  };
  r.readAsText(file);
}

/* =========================================================
   FILL FROM A CALL
   For a call held without the plan open. The CSM adds the transcript, copies a prompt built from

   reply back, and ticks each answer before it goes in. This page sends nothing anywhere, and the

  const secs = p.meta.flow ? visibleSections(p) : SECTIONS.filter(s => !s.set && !shelved.has(s.key)).map(s => sectionByKey(s.key, p));
  if (p.meta.template === 'prospect') PX_AREAS.forEach(a => { if (!secs.some(s => s && s.key === a.key)) secs.splice(secs.length - 1, 0, sectionByKey(a.key, p)); });   // any pain area the call covered

    const sid = 'S' + (steps.length + 1), addOn = !inPlan(p, s);

    return 'A list of milestones agreed on the call, each {"text": "...", "who": "FactorLab" or "Customer" or "Together"}.' + (now.length ? ' Already planned (leave these out unless the call changed who does them): ' + now.join('; ') + '.' : '');

  if (act === 'fill-check') {
    let obj;
    try { obj = fillParse(st.reply); } catch (e) { st.err = e.message === 'cut off' ? 'The reply looks cut off before the end. Ask your AI to send the whole answer again in one code block, then paste it here.' : 'That doesn’t look like the AI’s answers. Copy its whole reply, including the part in the code block, and paste it again.'; renderWork(); return; }
    st.err = ''; st.items = fillItems(p, obj); renderWork(); window.scrollTo(0, 0); return;
  }
  if (act === 'fill-tick') { st.items.forEach(it => it.on = !!a.dataset.on); renderWork(); return; }
  if (act === 'fill-back') { st.items = null; renderWork(); return; }
  if (act === 'fill-apply') {
    const r = fillApply(p, st.items);
    fillDone = 'Added ' + r.n + ' answer' + (r.n === 1 ? '' : 's') + ' from the call.' + (r.sorted ? ' ' + r.sorted + ' went to Notes to sort.' : '') + ' Go through each step to check them.';
    fill = null; saveSoon(); currentSec = 'basics'; renderAll(); window.scrollTo(0, 0);
  }
}
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.fillFile && t.files && t.files.length) { fillAddFiles(t.files, t.dataset.fillFile); t.value = ''; } });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.remove('over'); if (/^logo-/.test(z.dataset.drop)) { const f = e.dataTransfer.files[0]; if (f) logoFromFile(f, z.dataset.drop.slice(5)); return; } fillAddFiles(e.dataTransfer.files, z.dataset.drop); } });

/* ---------- Dark mode: More, then Dark mode. Remembered in this browser; open windows follow along. ---------- */
function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
function paintTheme() {
  const b = document.getElementById('themeCmd'); if (b) b.textContent = isDark() ? 'Light mode' : 'Dark mode';
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', isDark() ? '#161d27' : '#ffffff');
}
function setTheme(dark, quiet) {
  if (dark) document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme');
  if (!quiet) try { localStorage.setItem('spb.theme', dark ? 'dark' : 'light'); } catch (e) {}
  paintTheme();
}
window.addEventListener('storage', e => { if (e.key === 'spb.theme') setTheme(e.newValue === 'dark', true); });
paintTheme();

/* Floating "See the map" button on smaller screens, where the map sits below the form. */
(function () {
  const fab = document.getElementById('mapFab'), side = document.getElementById('side');
  function sideInView() { return side.getBoundingClientRect().top < window.innerHeight * 0.6; }
  function update() {
    const up = sideInView(), html = up ? 'Back to editing<span class="fab-arrow" aria-hidden="true">&uarr;</span>' : 'See the map<span class="fab-arrow" aria-hidden="true">&darr;</span>';
    if (fab.innerHTML !== html) fab.innerHTML = html;
    fab.style.display = cur() && !builder && !repick ? '' : 'none';
  }
  fab.addEventListener('click', () => {
    if (sideInView()) window.scrollTo({ top: 0, behavior: 'smooth' });
    else side.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  document.addEventListener('click', () => setTimeout(update, 50));
  update();
})();

if (NOTE_MODE) initNote();
</script>
